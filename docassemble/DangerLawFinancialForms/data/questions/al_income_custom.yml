---
id: how many creditors
question: | 
  Do you have any creditors? 
subquestion: |
  A creditor is someone or a company that you owe money to. They give you money or things you need and expect you to pay them back later. Examples of creditors are banks, credit card companies, and the people who supply you with stuff.
  
  Don't list anything you already listed in your weekly expenses here.
fields:
  - I have creditors: creditors.there_are_any
    datatype: yesnoradio
---
### pretending that market_value is weekly payment for now
id: creditor information
question: | 
  % if creditors.target_number > 1:
  Tell us about your ${ ordinal(i) } creditor.
  % else:
  Tell us about your creditor.
  % endif
subquestion: | 
  Don't list anything you already listed in your weekly expenses here.
fields:
  - Creditor's name: creditors[i].name
  - Nature of debt: creditors[i].nature_of_debt
  - Date incurred: creditors[i].date_incurred
    datatype: date
  - Amount due: creditors[i].balance
    datatype: currency
  - Weekly payment: creditors[i].market_value
    datatype: currency
  - Do you have any other creditors?: creditors[i].there_is_another
    datatype: yesnoradio
