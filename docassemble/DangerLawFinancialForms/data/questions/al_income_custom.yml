###
### A file that includes customized versions of al_income questions
###
---
### for jobs
only sets: x.complete
generic object: ALItemizedJob
code: |
  x.source
  if not x.is_self_employed:
    x.employer.name.first
  else:
    x.employer.name.first = "Self-employed"
    x.employer.name.last = ""
    x.employer.phone = ""
    x.employer.address.address = ""
  x.to_add.complete_attribute = 'complete'
  x.to_subtract.complete_attribute = 'complete'
  if x.is_self_employed:
    x.to_add["self employment"].exists = True
    x.is_hourly = None
    x.is_part_time = False
  else:
    x.to_add["self employment"].exists = False
    x.times_per_year
    if x.is_part_time:
      x.to_add["part time"].is_hourly = x.is_hourly
    else:
      x.to_add["full time"].is_hourly = x.is_hourly
  x.to_add.gather()
  x.other_income_sources.gather()
  x.add_required_taxes
  x.to_subtract.gather()
  x.complete = True
---
generic object: ALItemizedJob 
code: |
  x.to_subtract.there_are_any = True
  x.to_subtract.there_is_another = False
---
generic object: ALItemizedJob 
code: |
  x.to_subtract.initializeObject("federal_taxes")
  x.to_subtract["federal_taxes"].exists = True
  x.to_subtract.initializeObject("state_taxes")
  x.to_subtract["state_taxes"].exists = True
  x.add_required_taxes = True
---
generic object: ALItemizedJob 
code: |
  if x.to_add[i] == 'bonuses':
    x.to_add.there_is_another = False
  if x.to_add[i] == 'overtime':
    x.to_add.there_is_another = False
  if x.to_add[i] == 'tips':
    x.to_add.there_is_another = False
  if x.to_add[i] == 'commissions':
    x.to_add.there_is_another = False
  if x.to_add[i].exists:
    x.to_add[i].value
  x.to_add[i].complete = True
---
generic object: ALItemizedJob 
code: |
  if x.to_subtract[i].exists:
    x.to_subtract[i].value
  x.to_subtract[i].complete = True
---
sets:
  - x.employer.name.first
id: employer
generic object: ALItemizedJob
question: |
  Tell us who employs you as a ${ x.source }
fields:
  - I am self-employed: x.is_self_employed
    datatype: yesno
  - Employer's name: x.employer.name.first
    show if:
      variable: x.is_self_employed
      is: False
  - note: |
      ---

      Employer's contact information
    show if:
      variable: x.is_self_employed
      is: False
  - Street address: x.employer.address.address
    address autocomplete: True
    show if:
      variable: x.is_self_employed
      is: False
  - Unit: x.employer.address.unit
    required: False
    show if:
      variable: x.is_self_employed
      is: False
  - City: x.employer.address.city
    show if:
      variable: x.is_self_employed
      is: False
  - State: x.employer.address.state
    show if:
      variable: x.is_self_employed
      is: False
  - Zip or postal code: x.employer.address.zip
    required: False
    show if:
      variable: x.is_self_employed
      is: False
  - Phone number: x.employer.phone_number
    show if:
      variable: x.is_self_employed
      is: False
---
generic object: ALItemizedJob
code: |
  if defined('x.to_add["full time"]'):
    x.to_add["full time"].exists = True
  else:
    x.to_add["full time"].exists = False
---
generic object: ALItemizedJob
code: |
  if defined('x.to_add["part time"]'):
    x.to_add["part time"].exists = True
  else:
    x.to_add["part time"].exists = False
---
generic object: ALItemizedJob
code: |
  x.to_subtract["federal_taxes"].exists = True
---
generic object: ALItemizedJob
code: |
  x.to_subtract["state_taxes"].exists = True
---
if: x.is_self_employed
id: self employed collect
generic object: ALItemizedJob
question: |
  Enter info for your job as a ${ x.source }
fields:
  - What is your self employed income?: x.to_add['self employment'].value
    datatype: currency
  - How often do you earn this amount?: x.times_per_year
    input type: radio
    code: |
      times_per_year_list
    datatype: integer
  - The job has other incomes: x.other_income_sources.there_are_any
    datatype: yesno
---
id: itemized job line items
generic object: ALItemizedJob
question: |
  Enter info from your paystub for your job as a ${ x.source }
fields:
  - label: |
      % if x.is_hourly:
      What is your hourly pay for this job?
      % else:
      What are your wages for this job?
      % endif
    field: x.to_add['full time'].value
    datatype: currency
    show if:
      code: x.is_part_time is False
  - label: |
      % if x.is_hourly:
      What is your hourly pay for this job?
      % else:
      What are your wages for this job?
      % endif
    field: x.to_add['part time'].value
    datatype: currency
    show if:
      code: x.is_part_time is True
  - I earn overtime at this job: x.to_add['overtime'].exists
    datatype: yesno
  - What is your overtime pay for this job?: x.to_add['overtime'].value
    datatype: currency
    show if: x.to_add['overtime'].exists
    required: False
  - I earn tips at this job: x.to_add['tips'].exists
    datatype: yesno
  - What do you earn for tips at this job?: x.to_add['tips'].value
    datatype: currency
    show if: x.to_add['tips'].exists
    required: False
  - I earn commissions at this job: x.to_add['commissions'].exists
    datatype: yesno
  - What do you earn for commissions at this job?: x.to_add['commissions'].value
    datatype: currency
    show if: x.to_add['commissions'].exists
    required: False
  - I earn bonuses at this job: x.to_add['bonuses'].exists
    datatype: yesno
  - What do you earn for bonuses at this job?: x.to_add['bonuses'].value
    datatype: currency
    show if: x.to_add['bonuses'].exists
    required: False
  - The job has other incomes: x.other_income_sources.there_are_any
    datatype: yesno
---
#generic object: ALJobsList
#question: |
#  Tell us about your ${ ordinal(j) } other income for ${ jobs[i].other_income_sources[j].source }
#---
id: income info for list
generic object: ALIncomeList
question: |
  Tell us about your ${ ordinal(i) } other income
subquestion: |
  % if i > 1:
  You have already told us about your incomes from ${ comma_and_list([income.source for income in x.complete_elements()]) }.
  % elif i > 0:
  You have already told us about your income from ${ comma_and_list([income.source for income in x.complete_elements()]) }.
  % endif
fields:
  - What type of income?: x[i].source
  - Times per year you receive this income: x[i].times_per_year
    input type: radio
    code: |
      times_per_year_list
  - Amount of income: x[i].value
    datatype: currency
  - There is another income: x.there_is_another
    datatype: yesno
---
id: itemized job deductions
generic object: ALItemizedJob
question: |
  Enter info from your paystub for your job as a ${ x.source }
fields:
  - What is your federal tax amount?: x.to_subtract['federal_taxes'].value
    datatype: currency
    required: False
  - What is your state tax amount?: x.to_subtract['state_taxes'].value
    datatype: currency
    required: False
  - I pay for FICA and medicare: x.to_subtract['fica_medicare'].exists
    datatype: yesno
  - What do you pay for medical insurance?: x.to_subtract['fica_medicare'].value
    datatype: currency
    required: False
    show if: x.to_subtract['fica_medicare'].exists
  - I pay for medical insurance: x.to_subtract['medical_insurance'].exists
    datatype: yesno
  - What do you pay for medical insurance?: x.to_subtract['medical_insurance'].value
    datatype: currency
    required: False
    show if: x.to_subtract['medical_insurance'].exists
  - I pay union dues: x.to_subtract['union_dues'].exists
    datatype: yesno
  - What do you pay for union dues?: x.to_subtract['union_dues'].value
    datatype: currency
    required: False
    show if: x.to_subtract['union_dues'].exists
  - I have a credit union loan repayment: x.to_subtract['credit_union_loan_repayment'].exists
    datatype: yesno
  - What is your credit union loan repayment deduction amount?: x.to_subtract['credit_union_loan_repayment'].value
    datatype: currency
    required: False
    show if: x.to_subtract['credit_union_loan_repayment'].exists
  - I have a credit union savings account: x.to_subtract['credit_union_savings_account'].exists 
    datatype: yesno
  - What is your credit union savings deduction amount?: x.to_subtract['credit_union_savings_account'].value
    datatype: currency
    required: False
    show if: x.to_subtract['credit_union_savings_account'].exists
  - I have a savings account: x.to_subtract['savings_account'].exists
    datatype: yesno
  - What is your savings account deduction amount?: x.to_subtract['savings_account'].value
    datatype: currency
    required: False
    show if: x.to_subtract['savings_account'].exists
  - I have a retirement account: x.to_subtract['retirement_account'].exists
    datatype: yesno
  - What is your retirement account deduction amount?: x.to_subtract['retirement_account'].value
    datatype: currency
    required: False
    show if: x.to_subtract['retirement_account'].exists
  - I have another deduction (i.e. Child Support, Deferred Compensation or 401K): x.to_subtract['other_account_deduction'].exists
    datatype: yesno
  - Explain: x.other_account_deduction_explain
    required: False
    show if: x.to_subtract['other_account_deduction'].exists
  - What is your other deduction amount?: x.to_subtract['other_account_deduction'].value
    datatype: currency
    required: False
    show if: x.to_subtract['other_account_deduction'].exists
---
#  - The job has other deductions: x.to_subtract.there_is_another
#    datatype: yesno
---
variable name: non_wage_income_terms
data: !!omap
  - dividends: "Dividends"
  - interest: "Interest"
  - trusts: "Trusts"
  - annuities: "Annuities"
  - pensions: "Pensions"
  - retirement funds: "Retirement funds"
  - social security: "Social Security"
  - disability: "Disability"
  - unemployment insurance: "Unemployment insurance" 
  - workers compensation: "Worker's compensation"
  - public assistance: "Public assistance"
  - child support: "Child Support"
  - alimony: "Alimony (actually received)"
  - rent: "Income from real estate (rent, etc)"
  - royalties: "Royalties and other rights"
  - household contributions: "Contributions from household memeber(s)"
  - other: "Other"
---
generic object: ALIncomeList
continue button field: other_incomes.revisit
question: |
  Edit incomes
subquestion: |
  Here is what you've told us about your non job incomes. You can add more or continue
  to the next question.

  ${ other_incomes.table }

  ${ other_incomes.add_action() }
field: review_other_incomes
